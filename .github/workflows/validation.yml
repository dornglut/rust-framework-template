name: Rust Framework Template Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-framework-template-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate framework template
    uses: dornglut/github-workflows/.github/workflows/reusable-rust-cargo-validate.yml@7c61aaa2da8941d1e25ddbe1169968d7ec7af577
