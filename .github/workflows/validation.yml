name: Rust Framework Template Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-framework-template-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate framework template
    uses: dornglut/github-workflows/.github/workflows/reusable-rust-cargo-validate.yml@556584babb622232ebc419d8edf9b4f732c97c2c
